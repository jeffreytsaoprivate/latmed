<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Accounting</title>

<style>
:root{
  color-scheme:light;
  --bg:#f4f4f1; --surface-1:#fcfcfb; --surface-2:#f0efea; --border:#e2e1db;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#8a8984;
  --accent:#2a78d6; --accent-ink:#fff;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300;
  --grid:#e8e7e2;
  --good:#0a7d3e; --warn:#a86400; --crit:#c02b2b;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#121211; --surface-1:#1a1a19; --surface-2:#232322; --border:#33322f;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8d8c85;
    --accent:#3987e5;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#0ca30c;
    --grid:#2b2b29;
    --good:#3ec27a; --warn:#e0a240; --crit:#ef6b6b;
  }
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text-primary)}
header{position:sticky;top:0;z-index:20;background:var(--surface-1);border-bottom:1px solid var(--border)}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted)}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--crit)}
nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;padding:10px 12px;font:inherit;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--text-primary);border-bottom-color:var(--accent);font-weight:600}
main{padding:18px;max-width:1400px;margin:0 auto}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--text-secondary);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--text-secondary)}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
input,select,textarea{font:inherit;color:var(--text-primary);background:var(--surface-1);border:1px solid var(--border);border-radius:7px;padding:6px 9px}
textarea{width:100%;min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:0;border-color:var(--accent)}
button.b{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);cursor:pointer;white-space:nowrap}
button.b:hover{background:var(--surface-2)}
button.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b.pri:hover{filter:brightness(1.07)}
button.b.danger{color:var(--crit)}
button.b.sm{padding:3px 8px;font-size:12.5px}
button.b:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface-1);padding:5px 10px;font:inherit;font-size:12.5px;color:var(--text-secondary);cursor:pointer}
.seg button.on{background:var(--surface-2);color:var(--text-primary);font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--text-secondary);position:sticky;top:0;background:var(--surface-1)}
td.r,th.r{text-align:right}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.tw{overflow:auto;max-height:68vh}
.muted{color:var(--text-muted)}.small{font-size:12px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary);margin:1px 2px 1px 0}
.cls{font-size:11.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--border);white-space:nowrap}
.cls.infusion{border-color:var(--series-3);color:var(--text-primary);background:color-mix(in srgb,var(--series-3) 14%,transparent)}
.cls.withdrawal{border-color:var(--series-2);color:var(--text-primary);background:color-mix(in srgb,var(--series-2) 14%,transparent)}
.cls.transfer{color:var(--text-muted)}
.status{font-size:11.5px;font-weight:600}
.status.good{color:var(--good)}.status.warn{color:var(--warn)}.status.crit{color:var(--crit)}
.chartbox{position:relative;height:300px}
.chartbox.tall{height:380px}
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:22px;text-align:center;color:var(--text-secondary);cursor:pointer}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;border:1px solid var(--border);background:var(--surface-2);font-size:13px}
.banner.warn{border-color:var(--warn)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-secondary)}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--text-primary);font-size:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:4vh 12px;overflow:auto}
#modal[hidden]{display:none}
.mbox{background:var(--surface-1);border-radius:12px;border:1px solid var(--border);width:min(720px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox.wide{width:min(1100px,100%)}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.mtitle{font-weight:650;font-size:16px;flex:1}
.mbody{padding:16px 18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--text-secondary);line-height:1}
.items td{padding:4px}
.items input{width:100%}
.linklist{max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.linklist label{display:flex;gap:8px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-primary);cursor:pointer;flex-direction:row}
.linklist label:last-child{border-bottom:0}
.linklist .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.sugg{font-size:11px;color:var(--accent);font-weight:600}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--surface-1);padding:9px 16px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.viewer{display:grid;grid-template-columns:300px 1fr;gap:14px;height:76vh}
.vlist{overflow:auto;border:1px solid var(--border);border-radius:8px}
.vitem{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.vitem.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.vpane{border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.vbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.vframe{flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface-2);overflow:auto}
.vframe iframe{width:100%;height:100%;border:0;background:#fff}
.vframe img{max-width:100%;max-height:100%}
.feed{max-height:420px;overflow:auto}
.feed .ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.feed .sw{width:10px;height:10px;border-radius:2px;margin-top:5px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
#dbgBtn{position:fixed;right:14px;bottom:14px;z-index:60;font:12px system-ui;padding:6px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#dbgBtn.err{border-color:var(--crit);color:var(--crit);font-weight:600}
#dbgPanel{position:fixed;left:12px;right:12px;bottom:56px;height:45vh;z-index:61;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
#dbgPanel[hidden]{display:none}
.dbgHead{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
#dbgLog{flex:1;margin:0;overflow:auto;padding:10px 12px;font:11.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--text-primary)}
@media (max-width:760px){.g2{grid-template-columns:1fr}.viewer{grid-template-columns:1fr;height:auto}.vlist{max-height:200px}.vframe{height:60vh}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">Ledger</div>
    <span class="pill" id="conn"><span class="dot"></span><span>Connecting…</span></span>
    <span class="grow" style="flex:1"></span>
    <span class="small muted" id="counts"></span>
  </div>
  <nav id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="txns">Transactions</button>
    <button data-tab="docs">Quotes &amp; Invoices</button>
    <button data-tab="files">File browser</button>
    <button data-tab="pos">Purchase orders</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="accounts">Accounts &amp; import</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>
<main id="main"></main>
<div id="modal" hidden><div class="mbox"><div class="mhead"><div class="mtitle"></div><button class="x" data-close>&times;</button></div><div class="mbody"></div></div></div>
<div id="toast"></div>

  const wrap = async (label, fn) => { const t = performance.now(); try { const r = await fn(); DBG.info(`${label} ok (${Math.round(performance.now() - t)} ms)`); return r; } catch (e) { DBG.err(`${label} FAILED`, e); throw e; } };
  return {
    kind: 'firebase', auth, A, F, S, db, st, projectId: cfg.projectId, prefix,
    async loadAll() { const out = {}; for (const n of COLS) { out[n] = await wrap(`firestore read ${prefix}${n}`, async () => { const s = await F.getDocs(c(n)); DBG.info(`  ${n}: ${s.size} docs`); return s.docs.map(d => ({...d.data(), id: d.id})); }); } return out; },
    async save(n, o) { await wrap(`firestore write ${prefix}${n}/${o.id}`, () => F.setDoc(F.doc(db, prefix + n, o.id), clean(o))); },
    async del(n, id) { await wrap(`firestore delete ${prefix}${n}/${id}`, () => F.deleteDoc(F.doc(db, prefix + n, id))); },
    async saveMany(n, arr) { for (let i = 0; i < arr.length; i += 400) { const b = F.writeBatch(db); arr.slice(i, i+400).forEach(o => b.set(F.doc(db, prefix + n, o.id), clean(o))); await wrap(`firestore batch ${prefix}${n} [${i}..${Math.min(i+400, arr.length)})`, () => b.commit()); } },
    async delMany(n, ids) { for (let i = 0; i < ids.length; i += 400) { const b = F.writeBatch(db); ids.slice(i, i+400).forEach(id => b.delete(F.doc(db, prefix + n, id))); await wrap(`firestore batch delete ${prefix}${n}`, () => b.commit()); } },
    async upload(path, file) { return wrap(`storage upload ${path} (${file.size} B, ${file.type})`, async () => { const r = S.ref(st, path); await S.uploadBytes(r, file, {contentType: file.type || 'application/octet-stream'}); return { path, url: await S.getDownloadURL(r) }; }); },
    async removeFile(path) { try { await wrap(`storage delete ${path}`, () => S.deleteObject(S.ref(st, path))); } catch {} },
    async fileUrl(f) { return f.url; }
  };
}
function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open('ledger-local', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function kv(db, mode, fn) { return new Promise((res, rej) => { const tx = db.transaction('kv', mode); const req = fn(tx.objectStore('kv')); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); }); }
async function makeLocal() {
  const d = await idbOpen();
  let cache = (await kv(d, 'readonly', s => s.get('data'))) || {};
  COLS.forEach(n => cache[n] ||= []);
  const persist = () => kv(d, 'readwrite', s => s.put(cache, 'data'));
  const put = (n, o) => { const a = cache[n]; const i = a.findIndex(x => x.id === o.id); i >= 0 ? a[i] = clean(o) : a.push(clean(o)); };
  return {
    kind: 'local',
    async loadAll() { return structuredClone(cache); },
    async save(n, o) { put(n, o); await persist(); },
    async del(n, id) { cache[n] = cache[n].filter(x => x.id !== id); await persist(); },
    async saveMany(n, arr) { const idx = new Map(cache[n].map((x, i) => [x.id, i])); arr.forEach(o => { const i = idx.get(o.id); if (i != null) cache[n][i] = clean(o); else { idx.set(o.id, cache[n].length); cache[n].push(clean(o)); } }); await persist(); },
    async delMany(n, ids) { const s = new Set(ids); cache[n] = cache[n].filter(x => !s.has(x.id)); await persist(); },
    async upload(path, file) { await kv(d, 'readwrite', s => s.put(file, 'file:' + path)); return { path, url: null }; },
    async removeFile(path) { await kv(d, 'readwrite', s => s.delete('file:' + path)); },
    async fileUrl(f) { if (f.url) return f.url; const b = await kv(d, 'readonly', s => s.get('file:' + f.path)); return b ? URL.createObjectURL(b) : null; }
  };
}

let store = null;

const UI = { tab: location.hash.slice(1) || 'overview', range: LS.get('ledger.range', '12m'), tx: { acct:'', cls:'all', q:'', tag:'', from:'', to:'' }, sel: new Set(), docF: { type:'', status:'', q:'', tag:'' }, viewIdx: 0, pendingImport: null };

function derive() {
  S.txns.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq || 0) - (b.seq || 0));
  docsByTxn = {};
  S.docs.forEach(d => (d.linkedTxnIds || []).forEach(t => (docsByTxn[t] ??= []).push(d)));
  const byAcct = {};
  S.txns.forEach(t => (byAcct[t.accountId] ??= []).push(t));
  for (const a of S.accounts) {
    const list = byAcct[a.id] || [];
    const pre = a.anchorDate ? list.filter(t => t.date <= a.anchorDate).reduce((s, t) => s + t.amount, 0) : 0;
    a._opening = (a.anchorBalance || 0) - pre;
    a._balance = a._opening + list.reduce((s, t) => s + t.amount, 0);
    a._count = list.length;
    a._last = list.length ? list[list.length - 1].date : null;
  }
  $('#counts').textContent = `${S.txns.length} transactions · ${S.docs.length} documents · ${S.pos.length} POs`;
}
const acctById = id => S.accounts.find(a => a.id === id);
const isCash = a => a && a.type !== 'credit';
const allTags = () => [...new Set([...S.txns.flatMap(t => t.tags || []), ...S.docs.flatMap(d => d.tags || [])])].sort();

function rangeStart() {
  const t = today();
  switch (UI.range) { case '3m': return addMonths(t, -3); case '6m': return addMonths(t, -6); case '12m': return addMonths(t, -12); case 'ytd': return t.slice(0, 4) + '-01-01'; default: return S.txns[0]?.date || addMonths(t, -12); }
}
function cashSeries() {
  const ids = new Set(S.accounts.filter(isCash).map(a => a.id));
  let bal = S.accounts.filter(isCash).reduce((s, a) => s + a._opening, 0);
  const byDay = new Map();
  for (const t of S.txns) if (ids.has(t.accountId)) byDay.set(t.date, (byDay.get(t.date) || 0) + t.amount);
  const pts = [];
  for (const d of [...byDay.keys()].sort()) { bal += byDay.get(d); pts.push({ d, y: bal }); }
  return { pts, opening: S.accounts.filter(isCash).reduce((s, a) => s + a._opening, 0) };
}
function balanceAt(series, d) { let b = series.opening; for (const p of series.pts) { if (p.d <= d) b = p.y; else break; } return b; }
function monthly(from) {
  const m = {};
  for (const t of S.txns) {
    if (t.date < from || t.cls === 'transfer') continue;
    const k = monthKey(t.date); const r = (m[k] ??= { inflow: 0, outflow: 0, capital: 0 });
    if (t.cls === 'infusion' || t.cls === 'withdrawal') r.capital += t.amount;
    else if (t.amount >= 0) r.inflow += t.amount; else r.outflow += -t.amount;
  }
  const keys = []; let k = monthKey(from); const end = monthKey(today());
  while (k <= end) { keys.push(k); k = monthKey(addMonths(k + '-01', 1)); }
  return keys.map(k => ({ k, ...(m[k] || { inflow: 0, outflow: 0, capital: 0 }) }));
}
const monthKey = d => d.slice(0, 7);
function burn() {
  const n = +S.settings.burnMonths || 3; const cur = monthKey(today());
  const months = []; for (let i = n; i >= 1; i--) months.push(monthKey(addMonths(cur + '-01', -i)));
  const set = new Set(months); let net = 0;
  for (const t of S.txns) if (!t.cls && set.has(monthKey(t.date))) net += t.amount;
  const avg = net / n; return { burn: Math.max(0, -avg), avgNet: avg, months };
}

function parseOFX(text) {

    const fail = (how, e) => { DBG.err(`sign-in (${how}) failed`, e); const h = authHint(e); $('#siErr', body).textContent = (e.code || e.message) + (h ? ' — ' + h : ''); };
    const prov = () => { const p = new store.A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); return p; };
    $('#siGoogle', body).onclick = async () => { DBG.info('sign-in: Google popup start'); try { const r = await store.A.signInWithPopup(store.auth, prov()); DBG.info('sign-in: Google popup ok', { uid: r.user.uid, email: r.user.email }); closeModal(); res(true); } catch (e) { fail('google-popup', e); } };
    $('#siGoogleR', body).onclick = async () => { DBG.info('sign-in: Google redirect start (page will reload)'); try { await store.A.signInWithRedirect(store.auth, prov()); } catch (e) { fail('google-redirect', e); } };
    $('#siGo', body).onclick = async () => { DBG.info('sign-in: email start', { email: $('#siE', body).value.trim() }); try { const r = await store.A.signInWithEmailAndPassword(store.auth, $('#siE', body).value.trim(), $('#siP', body).value); DBG.info('sign-in: email ok', { uid: r.user.uid }); closeModal(); res(true); } catch (e) { fail('email', e); } };
    $('#siLocal', body).onclick = () => { DBG.info('sign-in: user chose local mode'); closeModal(); res(false); };
    $('#siDbg', body).onclick = () => toggleDebug(true);
  });
}
async function boot() {
  DBG.mark('boot');
  setConn('', 'Connecting…');
  const cfg = LS.get('ledger.fbConfig', FIREBASE_CONFIG); const prefix = LS.get('ledger.prefix', defaultPrefix(cfg));
  DBG.info('boot config', { source: localStorage.getItem('ledger.fbConfig') ? 'localStorage (Settings)' : 'hard-coded FIREBASE_CONFIG', projectId: cfg?.projectId, authDomain: cfg?.authDomain, storageBucket: cfg?.storageBucket, prefix, requireAuth: LS.get('ledger.auth', false), forceLocal: LS.get('ledger.forceLocal', false) });
  store = null;
  if (cfg && !LS.get('ledger.forceLocal', false)) {
    try {
      store = await makeFirebase(cfg, prefix);
      if (LS.get('ledger.auth', false) && !store.auth.currentUser) { const ok = await signIn(); if (!ok) { LS.set('ledger.forceLocal', true); store = null; } }
    } catch (e) { DBG.err('boot: Firebase setup failed → local mode', e); toast('Firebase failed: ' + (e.code || e.message) + ' — using local mode. Open Debug for details.', 7000); store = null; }
  }
  if (!store) store = await makeLocal();
  DBG.info('boot: storage backend = ' + store.kind);
  try {
    const d = await store.loadAll();
    S.accounts = d.accounts || []; S.txns = d.txns || []; S.docs = d.docs || []; S.pos = d.pos || [];
    S.settings = { ...DEFAULT_SETTINGS, ...((d.settings || []).find(x => x.id === 'main') || {}) };
    setConn(store.kind === 'firebase' ? 'ok' : 'warn', store.kind === 'firebase' ? `Firebase · ${store.projectId}${store.auth.currentUser ? ' · ' + (store.auth.currentUser.email || 'anon') : ''}` : 'Local mode');
    DBG.info('boot: data loaded', { accounts: S.accounts.length, txns: S.txns.length, docs: S.docs.length, pos: S.pos.length });
  } catch (e) {
    DBG.err('boot: data load failed', e);
    setConn('bad', 'Load failed'); toast('Could not load data: ' + (e.code || e.message) + (e.code === 'permission-denied' ? ' — Firestore rules rejected this user.' : '') + ' Open Debug for details.', 9000);
    if (store.kind === 'firebase') { const fb = store; store = await makeLocal(); store._failedFirebase = fb; const d = await store.loadAll(); Object.assign(S, { accounts: d.accounts, txns: d.txns, docs: d.docs, pos: d.pos }); setConn('bad', 'Firebase error — local mode'); }
  }
  go(UI.tab);
}

/* ---------------- debug panel & diagnostics ---------------- */
function envInfo() {
  const cfg = LS.get('ledger.fbConfig', FIREBASE_CONFIG) || {};
  const fb = store?.kind === 'firebase' ? store : store?._failedFirebase;
  const u = fb?.auth?.currentUser;
  let ls = false, ss = false; try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); ls = true; } catch {} try { sessionStorage.setItem('_t', '1'); sessionStorage.removeItem('_t'); ss = true; } catch {}
  return {
    when: new Date().toString(), href: location.href, origin: location.origin, protocol: location.protocol, hostname: location.hostname,
    userAgent: navigator.userAgent, cookiesEnabled: navigator.cookieEnabled, localStorage: ls, sessionStorage: ss, indexedDB: !!window.indexedDB,
    inIframe: window.top !== window.self, online: navigator.onLine,
    config: { apiKey: cfg.apiKey ? cfg.apiKey.slice(0, 8) + '…' + cfg.apiKey.slice(-4) : null, authDomain: cfg.authDomain, projectId: cfg.projectId, storageBucket: cfg.storageBucket, appId: cfg.appId, source: localStorage.getItem('ledger.fbConfig') ? 'Settings/localStorage' : 'hard-coded' },
    prefix: LS.get('ledger.prefix', defaultPrefix(cfg)), requireAuth: LS.get('ledger.auth', false), forceLocal: LS.get('ledger.forceLocal', false),
    backend: store?.kind, firebaseSdk: FB_VER,
    user: u ? { uid: u.uid, email: u.email, emailVerified: u.emailVerified, anonymous: u.isAnonymous, providers: u.providerData.map(p => p.providerId) } : null,
    libs: { Chart: !!window.Chart, jsPDF: !!window.jspdf }
  };
}
function report() { return ['=== LEDGER DEBUG REPORT ===', JSON.stringify(envInfo(), null, 2), '', '=== LOG ===', ...DBG.lines()].join('\n'); }
async function runDiagnostics() {
  DBG.mark('diagnostics start');
  const env = envInfo(); DBG.info('env', env);
  if (location.protocol === 'file:') DBG.warn('Opened as file:// — Google sign-in cannot work here.');
  if (env.inIframe) DBG.warn('Page is inside an iframe — popups/storage may be restricted.');
  if (/github\.io$/.test(location.hostname)) DBG.info(`GitHub Pages host — make sure "${location.hostname}" is in Firebase Authorized domains (no https://, no path).`);
  const fb = store?.kind === 'firebase' ? store : store?._failedFirebase;
  if (!fb) { DBG.warn('Firebase not active (local mode). Try Settings → Save & reconnect, then rerun.'); return; }
  try { const r = await fetch(`https://${env.config.authDomain}/__/auth/handler`, { method: 'HEAD', mode: 'no-cors' }); DBG.info('authDomain handler reachable (opaque response)', { type: r.type }); } catch (e) { DBG.err('authDomain handler NOT reachable', e); }
  const u = fb.auth.currentUser;
  if (!u) { DBG.warn('Not signed in — Firestore/Storage tests will use no auth.'); }
  else {
    try { const t = await u.getIdTokenResult(true); DBG.info('ID token claims', { email: t.claims.email, email_verified: t.claims.email_verified, sign_in_provider: t.signInProvider, aud: t.claims.aud, expires: t.expirationTime }); if (t.claims.aud !== env.config.projectId) DBG.err('token audience ≠ projectId'); }
    catch (e) { DBG.err('getIdTokenResult failed', e); }
  }
  const { F, S, db, st, prefix } = fb;
  try { const s = await F.getDocs(F.query(F.collection(db, prefix + 'settings'), F.limit(1))); DBG.info(`TEST firestore read ${prefix}settings: OK (${s.size} doc)`); } catch (e) { DBG.err(`TEST firestore read ${prefix}settings: FAILED`, e); }
  const probe = F.doc(db, prefix + 'settings', '_debug_probe');
  try { await F.setDoc(probe, { at: new Date().toISOString(), uid: u?.uid || null }); DBG.info('TEST firestore write: OK'); await F.deleteDoc(probe); DBG.info('TEST firestore delete: OK'); } catch (e) { DBG.err('TEST firestore write/delete: FAILED', e); }
  try { const l = await S.list(S.ref(st, 'accounting/docs'), { maxResults: 1 }); DBG.info(`TEST storage list accounting/docs: OK (${l.prefixes.length + l.items.length} entries)`); } catch (e) { DBG.err('TEST storage list: FAILED', e); }
  const pr = S.ref(st, 'accounting/_debug_probe.txt');
  try { await S.uploadString(pr, 'probe ' + new Date().toISOString()); DBG.info('TEST storage upload: OK'); await S.getDownloadURL(pr); DBG.info('TEST storage getDownloadURL: OK'); await S.deleteObject(pr); DBG.info('TEST storage delete: OK'); } catch (e) { DBG.err('TEST storage upload/url/delete: FAILED', e); }
  DBG.mark('diagnostics done');
}
function toggleDebug(show) {
  const p = $('#dbgPanel'); p.hidden = show === undefined ? !p.hidden : !show;
  if (!p.hidden) { $('#dbgLog').textContent = DBG.lines().join('\n'); $('#dbgLog').scrollTop = 1e9; }
}
document.body.insertAdjacentHTML('beforeend', `
<button id="dbgBtn" title="Debug log">🐞 Debug</button>
<div id="dbgPanel" hidden>
  <div class="dbgHead"><b>Debug</b><span class="small muted">Run diagnostics, then copy the report and paste it to Claude. API key is redacted.</span><span style="flex:1"></span>
    <button class="b sm" id="dbgRun">Run diagnostics</button><button class="b sm pri" id="dbgCopy">Copy debug report</button><button class="b sm" id="dbgDl">Download .txt</button><button class="b sm" id="dbgClear">Clear</button><button class="x" id="dbgX">&times;</button></div>
  <pre id="dbgLog"></pre>
</div>`);
$('#dbgBtn').onclick = () => toggleDebug(); $('#dbgX').onclick = () => toggleDebug(false);
$('#dbgClear').onclick = () => DBG.clear();
$('#dbgRun').onclick = async () => { const b = $('#dbgRun'); b.disabled = true; b.textContent = 'Running…'; try { await runDiagnostics(); } finally { b.disabled = false; b.textContent = 'Run diagnostics'; } };
$('#dbgCopy').onclick = async () => { const txt = report(); try { await navigator.clipboard.writeText(txt); toast('Debug report copied — paste it into the chat'); } catch { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Debug report copied'); } };
$('#dbgDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([report()], { type: 'text/plain' })); a.download = `ledger-debug-${today()}.txt`; a.click(); };
if (/[?&]debug\b/.test(location.search)) toggleDebug(true);
boot();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Accounting</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f1; --surface-1:#fcfcfb; --surface-2:#f0efea; --border:#e2e1db;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#8a8984;
  --accent:#2a78d6; --accent-ink:#fff;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300;
  --grid:#e8e7e2;
  --good:#0a7d3e; --warn:#a86400; --crit:#c02b2b;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#121211; --surface-1:#1a1a19; --surface-2:#232322; --border:#33322f;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8d8c85;
    --accent:#3987e5;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#0ca30c;
    --grid:#2b2b29;
    --good:#3ec27a; --warn:#e0a240; --crit:#ef6b6b;
  }
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text-primary)}
header{position:sticky;top:0;z-index:20;background:var(--surface-1);border-bottom:1px solid var(--border)}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted)}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--crit)}
nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;padding:10px 12px;font:inherit;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--text-primary);border-bottom-color:var(--accent);font-weight:600}
main{padding:18px;max-width:1400px;margin:0 auto}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--text-secondary);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--text-secondary)}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
input,select,textarea{font:inherit;color:var(--text-primary);background:var(--surface-1);border:1px solid var(--border);border-radius:7px;padding:6px 9px}
textarea{width:100%;min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:0;border-color:var(--accent)}
button.b{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);cursor:pointer;white-space:nowrap}
button.b:hover{background:var(--surface-2)}
button.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b.pri:hover{filter:brightness(1.07)}
button.b.danger{color:var(--crit)}
button.b.sm{padding:3px 8px;font-size:12.5px}
button.b:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface-1);padding:5px 10px;font:inherit;font-size:12.5px;color:var(--text-secondary);cursor:pointer}
.seg button.on{background:var(--surface-2);color:var(--text-primary);font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--text-secondary);position:sticky;top:0;background:var(--surface-1)}
td.r,th.r{text-align:right}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.tw{overflow:auto;max-height:68vh}
.muted{color:var(--text-muted)}.small{font-size:12px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary);margin:1px 2px 1px 0}
.cls{font-size:11.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--border);white-space:nowrap}
.cls.capital{border-color:var(--series-3);color:var(--text-primary);background:color-mix(in srgb,var(--series-3) 14%,transparent)}
.cls.capital.neg{border-color:var(--series-2);background:color-mix(in srgb,var(--series-2) 14%,transparent)}
.xfer{display:block;font-size:11.5px;margin-top:3px;color:var(--text-secondary);cursor:pointer;text-decoration:none}
.xfer.need{color:var(--warn);font-weight:600}
.cls.transfer{color:var(--text-muted)}
.status{font-size:11.5px;font-weight:600}
.status.good{color:var(--good)}.status.warn{color:var(--warn)}.status.crit{color:var(--crit)}
.chartbox{position:relative;height:300px}
.chartbox.tall{height:380px}
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:22px;text-align:center;color:var(--text-secondary);cursor:pointer}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;border:1px solid var(--border);background:var(--surface-2);font-size:13px}
.banner.warn{border-color:var(--warn)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-secondary)}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--text-primary);font-size:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:4vh 12px;overflow:auto}
#modal[hidden]{display:none}
.mbox{background:var(--surface-1);border-radius:12px;border:1px solid var(--border);width:min(720px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox.wide{width:min(1100px,100%)}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.mtitle{font-weight:650;font-size:16px;flex:1}
.mbody{padding:16px 18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--text-secondary);line-height:1}
.items td{padding:4px}
.items input{width:100%}
.linklist{max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.linklist label{display:flex;gap:8px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-primary);cursor:pointer;flex-direction:row}
.linklist label:last-child{border-bottom:0}
.linklist .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.sugg{font-size:11px;color:var(--accent);font-weight:600}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--surface-1);padding:9px 16px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.viewer{display:grid;grid-template-columns:300px 1fr;gap:14px;height:76vh}
.vlist{overflow:auto;border:1px solid var(--border);border-radius:8px}
.vitem{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.vitem.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.vpane{border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.vbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.vframe{flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface-2);overflow:auto}
.vframe iframe{width:100%;height:100%;border:0;background:#fff}
.vframe img{max-width:100%;max-height:100%}
.feed{max-height:420px;overflow:auto}
.feed .ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.feed .sw{width:10px;height:10px;border-radius:2px;margin-top:5px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
#dbgBtn{position:fixed;right:14px;bottom:14px;z-index:60;font:12px system-ui;padding:6px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#dbgBtn.err{border-color:var(--crit);color:var(--crit);font-weight:600}
#dbgPanel{position:fixed;left:12px;right:12px;bottom:56px;height:45vh;z-index:61;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
#dbgPanel[hidden]{display:none}
.dbgHead{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
#dbgLog{flex:1;margin:0;overflow:auto;padding:10px 12px;font:11.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--text-primary)}
.mbox.xwide{width:min(1500px,100%)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
.splitR{position:sticky;top:0;height:min(82vh,1100px);display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.splitR .pvbar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-secondary)}
.splitR .pvbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.splitR .pv{flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface-2);overflow:auto}
.splitR .pv iframe{width:100%;height:100%;border:0;background:#fff}
.splitR .pv img{max-width:100%;max-height:100%;object-fit:contain}
tr.pending td{background:color-mix(in srgb,var(--warn) 11%,transparent)}
tr.pending td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.pbadge{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
/* PDF pages: canvas + transparent selectable text layer (pdf.js) */
.pdfPage{position:relative;margin:12px auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pdfPage canvas{position:absolute;inset:0;width:100%;height:100%}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2;opacity:1}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(42,120,214,.35)}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.pdfNoText{font-size:12px;color:var(--text-muted);text-align:center;padding:6px}
/* document chain pills */
.chain{display:flex;align-items:center;flex-wrap:nowrap;gap:2px;white-space:nowrap}
.ch{font:inherit;font-size:11.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);cursor:pointer;line-height:1.4}
.ch.ok{border-color:color-mix(in srgb,var(--good) 55%,transparent);color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
.ch.self{font-weight:700;color:var(--text-primary);cursor:default}
.ch.miss{border:1px dashed var(--warn);color:var(--warn);font-weight:600;background:color-mix(in srgb,var(--warn) 8%,transparent)}
.ch.miss:hover{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.ch.na{opacity:.5;cursor:default}
.kpi.kgo{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kpi.kgo:hover{border-color:var(--accent);box-shadow:0 1px 6px color-mix(in srgb,var(--accent) 18%,transparent)}
.kpi .kar{color:var(--text-muted);font-weight:600}
.kpi.kgo:hover .kar{color:var(--accent)}
.racts{white-space:nowrap;text-align:right}
.racts .ract{min-width:30px;padding:2px 6px;margin-left:3px;line-height:1.3}
.racts .ract[data-act=edit]{font-weight:700;letter-spacing:1px}
.lkSupport{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
.lkSupRow{display:flex;gap:6px;margin:6px 0;overflow-x:auto}
.lkSupRow .lkCol{min-width:150px}
.feed .att{cursor:pointer;align-items:center;border-radius:6px;padding:7px 6px}
.feed .att:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.feed .att .kar{color:var(--text-muted);font-weight:700;padding-left:8px}
.feed .att:hover .kar{color:var(--accent)}
.chsep{color:var(--text-muted);font-size:11px}
/* editor navigation + linkage panel */
.mnav{display:flex;align-items:center;gap:8px;margin-right:12px}
.linkage{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:14px;background:var(--surface-2)}
.linkage:empty{display:none}
.lkTitle{font-weight:650;font-size:13px;margin-bottom:8px}
.lkRow{display:flex;gap:6px;align-items:stretch;overflow-x:auto}
.lkCol{flex:1 1 0;min-width:170px;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.lkCol.miss{border:1px dashed var(--warn)}
.lkCol.self{background:transparent;border-style:dotted}
.lkHead{font-size:12px;font-weight:650;color:var(--text-secondary)}
.lkCol.ok .lkHead{color:var(--good)} .lkCol.miss .lkHead{color:var(--warn)}
.lkItem{display:flex;gap:6px;justify-content:space-between;align-items:flex-start;font-size:12.5px;border-top:1px solid var(--border);padding-top:5px}
.lkItem:first-of-type{border-top:0;padding-top:0}
.lkBtns{display:flex;gap:4px;flex:none}
.lkAdd{font-size:12px;width:100%;max-width:100%}
.lkArrow{align-self:center;color:var(--text-muted)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--text-primary)}
th.sortable .arr{font-size:10px;margin-left:3px;color:var(--accent)}
tr.rowlink{cursor:pointer}
/* picker tables */
.ptable .sugg{white-space:nowrap}
.ptable td.nw,.ptable th{white-space:nowrap}
.ptable tr.taken td{opacity:.5}
.ptable tr.taken:hover td{opacity:.85}
.ptable tr.on td{background:color-mix(in srgb,var(--good) 9%,transparent)}
.ptable tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ptable tr.pgroup td{font-size:11.5px;color:var(--text-muted);background:var(--surface-2);font-weight:600;opacity:1}
.ptable tbody tr[data-id]{cursor:pointer}
.lkSum{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12.5px;padding:6px 8px;border-radius:7px;background:var(--surface-1);border:1px solid var(--border)}
.lkSum.bad{border-color:var(--warn);color:var(--text-primary)}
.lkSum .amtx{color:var(--warn);font-weight:700}
.lkUp{display:block;margin-top:auto;padding:6px;border:1px dashed var(--border);border-radius:6px;text-align:center;font-size:11.5px;color:var(--text-muted);cursor:pointer}
.lkUp:hover{color:var(--text-secondary);border-color:var(--accent)}
.lkCol.dropping{outline:2px solid var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 8%,var(--surface-1))}
.lkCol.dropping .lkUp{border-color:var(--accent);color:var(--accent)}
.lkCol.busy{opacity:.6;pointer-events:none}
@media (max-width:1000px){.split{grid-template-columns:1fr}.splitR{position:static;height:70vh}}
@media (max-width:760px){.g2{grid-template-columns:1fr}.viewer{grid-template-columns:1fr;height:auto}.vlist{max-height:200px}.vframe{height:60vh}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">Ledger</div>
    <span class="pill" id="conn"><span class="dot"></span><span>Connecting…</span></span>
    <span class="grow" style="flex:1"></span>
    <span class="small muted" id="counts"></span>
  </div>
  <nav id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="txns">Transactions</button>
    <button data-tab="docs">Documents<span id="pendBadge"></span></button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>
<main id="main"></main>
<div id="modal" hidden><div class="mbox"><div class="mhead"><div class="mtitle"></div><button class="x" data-close>&times;</button></div><div class="mbody"></div></div></div>
<div id="toast"></div>

const defaultPrefix = cfg => cfg?.appId ? `artifacts/${cfg.appId}/private/accounting/` : 'acct_';

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const USD = new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'});
const money = n => USD.format(n || 0);
const moneyK = n => { const a = Math.abs(n||0); return (n<0?'-':'') + '$' + (a>=1e6 ? (a/1e6).toFixed(1)+'M' : a>=1e3 ? (a/1e3).toFixed(a>=1e4?0:1)+'k' : a.toFixed(0)); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

const addMonths = (d, n) => { const [y,m,dd] = d.split('-').map(Number); const t = new Date(Date.UTC(y, m-1+n, 1)); const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate(); t.setUTCDate(Math.min(dd, last)); return fromTs(t.getTime()); };

/* ======================= LINKING (transactions ↔ quotes / invoices / POs) ======================= */
const LINK_TYPES = { quote: ['Quote', 'Q'], invoice: ['Invoice', 'INV'], receipt: ['Receipt', 'R'], proposal: ['Proposal', 'PR'], result: ['Result', 'RES'], other: ['Other', 'D'], po: ['Purchase order', 'PO'] };
function linkItem(kind, r) {

  return { kind, id: r.id, rec: r, type, typeLabel: LINK_TYPES[type]?.[0] || type, short: LINK_TYPES[type]?.[1] || '?', number: r.number || '', vendor: r.vendor || '', date: r.date || '', amount: kind === 'po' ? poTotals(r).total : (+r.amount || 0), status: r.status || '', file: r.file, fileName: r.fileName, linked: r.linkedTxnIds || [] };
}
const linkCandidates = () => [...S.docs.filter(d => !ATTACH.has(d.type)).map(d => linkItem('doc', d)), ...S.pos.map(p => linkItem('po', p))];
const STOP = new Set(['inc','llc','ltd','corp','corporation','company','the','and','usa','co','of','group','services','international','intl','des','ach','pos','purchase','payment','online','bank']);
const tokens = s => String(s || '').toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !STOP.has(w));
/* Score how likely transaction t pays/relates to item c. ≥50 = suggested, ≥90 = strong. */
function matchScore(t, c) {

    if (diff < 0.005) { sc += 60; why.push('exact amount'); }
    else if (diff <= Math.max(1, ia * 0.02)) { sc += 45; why.push('amount ±2%'); }
    else if (amt < ia && amt >= ia * 0.1) { sc += 8; why.push('partial?'); }
  }
  if (c.date && t.date) {
    const days = Math.abs(ts(t.date) - ts(c.date)) / 864e5;
    if (days <= 7) { sc += 15; why.push('≤1 wk'); } else if (days <= 45) { sc += 10; why.push('≤45 d'); } else if (days <= 120) sc += 4; else if (days > 365) sc -= 20;
  }
  const desc = (t.description + ' ' + (t.notes || '')).toLowerCase();
  const vt = tokens(c.vendor);
  if (vt.length && vt.some(w => desc.includes(w))) { sc += 35; why.push('vendor name'); }
  if (c.number && c.number.length >= 3 && desc.includes(c.number.toLowerCase().replace(/^po[-\s]*/, ''))) { sc += 40; why.push('number in memo'); }
  return { score: sc, why };
}
function suggestionsFor(t, cands = linkCandidates()) {

  return cands.filter(c => !c.linked.includes(t.id)).map(c => ({ c, ...matchScore(t, c) })).filter(x => x.score >= 50).sort((a, b) => b.score - a.score);
}

/* ======================= INTERNAL TRANSFERS ======================= */
/* A transfer is never balanced by an invented entry: it is paired with the real opposite transaction in the
   other account, or flagged until that transaction is imported. */
const acctName = id => acctById(id)?.name || 'unknown account';
const isUntracked = t => t.transferAcct === 'untracked' || (t.transferAcct === '' && t.transferPairId === '');
async function clearTransferPair(t) {
  const pid = t.transferPairId; if (!pid) return;
  const other = S.txns.find(x => x.id === pid);
  t.transferPairId = '';
  if (other) {
    if (other.autoTransfer) { await store.del('txns', other.id); S.txns = S.txns.filter(x => x.id !== other.id); DBG.info('transfer: removed legacy auto-created entry ' + other.id); }
    else { other.transferPairId = ''; await persist('txns', other); }
  }
}
/* Candidate balancing entries for t: opposite amount, another account, within 10 days, not already paired. */
function transferMatches(t, acctId) {
  return S.txns.filter(x => x.id !== t.id && x.accountId !== t.accountId && (!acctId || x.accountId === acctId) && !x.autoTransfer
      && (!x.transferPairId || x.transferPairId === t.id) && Math.abs(x.amount + t.amount) < 0.01
      && Math.abs(ts(x.date) - ts(t.date)) <= 10 * 864e5 && (!x.cls || x.cls === 'transfer'))
    .sort((a, b) => ((b.id === t.transferPairId) - (a.id === t.transferPairId)) || ((b.cls === 'transfer') - (a.cls === 'transfer'))
      || (TRANSFER_RE.test(b.description) - TRANSFER_RE.test(a.description)) || Math.abs(ts(a.date) - ts(t.date)) - Math.abs(ts(b.date) - ts(t.date)));
}
/* Pair every unmatched transfer that has one clear balancing entry. Returns the number of pairs made. */
async function autoPairTransfers() {
  const changed = []; let n = 0;
  for (const t of S.txns) {
    if (t.cls !== 'transfer' || t.transferPairId || isUntracked(t)) continue;
    const c = transferMatches(t, t.transferAcct && t.transferAcct !== 'untracked' ? t.transferAcct : null).filter(x => !x.transferPairId);
    if (!c.length || (c.length > 1 && !(c[0].cls === 'transfer' && c[1].cls !== 'transfer'))) continue;
    const m = c[0];
    Object.assign(t, { transferPairId: m.id, transferAcct: m.accountId });
    Object.assign(m, { cls: 'transfer', transferPairId: t.id, transferAcct: t.accountId });
    changed.push(t, m); n++;
  }
  if (changed.length) { await persistMany('txns', changed); DBG.info(`transfers: auto-paired ${n}`); }
  return n;
}
function transferDialog(t, onDone) {
  const others = S.accounts.filter(a => a.id !== t.accountId);

  const dir = t.amount < 0 ? 'to' : 'from';

  const body = modal('Internal transfer', `
    <div class="banner"><b>${esc(t.description)}</b><br><span class="small">${fmtDate(t.date)} · ${esc(acctName(t.accountId))} · <b>${money(t.amount)}</b></span></div>

      <div class="linklist">${cands.map((x, i) => `<label><input type="radio" name="xPick" value="${x.id}" ${i === 0 ? 'checked' : ''}> ${x.id === t.transferPairId ? '<span class="sugg">CURRENT</span>' : '<span class="sugg">MATCH</span>'} ${fmtDate(x.date)} · ${esc(x.description)}<span class="amt">${money(x.amount)}</span></label>`).join('')}</div>`
      : `<div class="banner warn small">⚑ No matching entry in <b>${esc(acctName(aid))}</b> — looking for ${money(-t.amount)} within 10 days of ${fmtDate(t.date)}.<br>The transfer will be saved and <b>flagged</b>; Ledger pairs it automatically when you import that account's statement.</div>`;
  };

    } catch (e) { btn.disabled = false; DBG.err('transfer save failed', e); toast('Save failed: ' + (e.code || e.message), 6000); }
  };

}

function transferBadge(t) {

/* ======================= TRANSACTIONS ======================= */
function filteredTxns() {

/* ---------- Attached files: fingerprints, duplicate detection, removal ---------- */
async function fileHash(f) {

}
const fileRecs = () => [...S.docs.filter(d => d.file).map(d => ({ kind: 'doc', rec: d })), ...S.pos.filter(p => p.file).map(p => ({ kind: 'po', rec: p }))];

}
function dupWhere(x) {

  return `${recLabel(x)}${r.date ? ' · dated ' + fmtDate(r.date) : ' · no date yet'}${up ? ' · uploaded ' + up : ''}${r.fileName ? ' · file “' + r.fileName + '”' : ''}${!r.file?.sha256 ? ' (older upload — matched on name + size)' : ''}`;
}
/* Clear Documents filters and open the given record, so a "duplicate" can always be found. */
function showRecord(kind, id) {

}
function recLabel(x) { const r = x.rec; return `${x.kind === 'po' ? 'Purchase order' : DOC_TYPES[r.type]} ${r.number || ''}${r.vendor ? ' · ' + r.vendor : ''}${r.needsReview ? ' (needs review)' : ''}`.replace(/\s+/g, ' ').trim(); }
/* Delete a record's stored file and clear it from the record (the record itself is kept). */

/* Before a batch upload: fingerprint every file, flag ones already uploaded (or repeated in the batch), let the user decide. */

    const f = files[i]; toast(`Checking for duplicates ${i + 1} of ${files.length}…`, 60000);
    const hash = await fileHash(f);
    const key = hash || `${f.name}|${f.size}`;
    const ex = findDupFile(f.name, f.size, hash);
    if (ex) DBG.info('duplicate file', { file: f.name, matches: ex.kind + ':' + ex.rec.id, label: recLabel(ex), bySha: !!(hash && ex.rec.file?.sha256 === hash) });

    const upd = () => { const n = out.length - dups.length + $$('input[data-i]:checked', body).length; $('#dupGo', body).textContent = `Continue (${n} to upload)`; };
    body.addEventListener('change', upd); upd();

function guessFromName(name) {
  const n = name.toLowerCase();
  const type = /(^|[^a-z])p\.?o([^a-z]|$)|purchase[\s_-]*order/.test(n) ? 'po' : /receipt|rcpt/.test(n) ? 'receipt' : /proposal/.test(n) ? 'proposal' : /result/.test(n) ? 'result' : /quot|estimate/.test(n) ? 'quote' : 'invoice';

  const toks = name.replace(/\.[a-z0-9]+$/i, '').split(/[\s_()]+/).filter(t => /\d/.test(t) && !/^\d{4}-?\d{2}-?\d{2}$|^\d{1,2}[-.]\d{1,2}[-.]\d{2,4}$/.test(t));
  const num = (toks.find(t => /^(inv|q|qt|quote|po|rcpt|#)/i.test(t)) || toks[toks.length - 1] || '').replace(/^#/, '');
  return { type, number: num };
}

}

/* ======================= DOCUMENT EDITOR: navigation + linkage panel ======================= */
const recOf = (kind, id) => (kind === 'po' ? S.pos : S.docs).find(x => x.id === id);
function openRecord(kind, id) { const r = recOf(kind, id); if (!r) return toast('Not found'); kind === 'po' ? editPO(r) : editDoc(r); }
/* Prev / Next follow the Documents list as currently filtered and sorted. */
function navNeighbors(kind, id) {
  const L = filteredAll(); const i = L.findIndex(x => x.kind === kind && x.rec.id === id);
  return { i, n: L.length, prev: i > 0 ? L[i - 1] : null, next: i >= 0 && i < L.length - 1 ? L[i + 1] : null };
}
/* Adds ‹ Prev · n of N · Next › to the modal header; leaving a changed form saves it first. */
function attachNav(body, kind, id, isDirty, save) {
  const nb = navNeighbors(kind, id); const head = $('#modal .mhead');
  const go = async target => {
    if (!target) return;
    if (isDirty()) { const ok = await save(() => openRecord(target.kind, target.rec.id)); if (ok === false) return; }
    else openRecord(target.kind, target.rec.id);
  };
  const nav = document.createElement('div'); nav.className = 'mnav';
  nav.innerHTML = `<button class="b sm" data-nav="prev" ${nb.prev ? '' : 'disabled'} title="Previous document (Alt+←)">‹ Prev</button><span class="small muted">${nb.i >= 0 ? `${nb.i + 1} of ${nb.n}` : 'not in current list'}</span><button class="b sm" data-nav="next" ${nb.next ? '' : 'disabled'} title="Next document (Alt+→)">Next ›</button>`;
  head.insertBefore(nav, $('.x', head));
  nav.onclick = e => { const b = e.target.closest('[data-nav]'); if (b) go(nb[b.dataset.nav]); };
  UI.navGo = dir => go(nb[dir]);
  return go;
}
document.addEventListener('keydown', e => {
  if ($('#modal').hidden || !UI.navGo || !$('#modal .mnav')) return;
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); UI.navGo(e.key === 'ArrowLeft' ? 'prev' : 'next'); }
});
/* Files dropped on a linkage column become new documents of that type, linked into the chain and marked "needs review".
   On Payments they become receipts (e.g. a wire confirmation) attached to the payment. */
async function addFilesToChain(files, step, kind, id, payTxnId) {
  let n = 0; const made = [];
  for (const f of files) {
    const hash = await fileHash(f); const ex = findDupFile(f.name, f.size, hash);
    if (ex && !confirm(`${f.name} is already uploaded as:\n${dupWhere(ex)}\n\nUpload it again anyway? (Cancel, then search Documents for “${ex.rec.number || ex.rec.fileName || ''}” to find it.)`)) continue;
    toast(`Uploading ${f.name}…`, 60000);
    const r = recOf(kind, id); const c = chainOf(kind, r); const g = guessFromName(f.name);
    const fileObj = async path => { const up = await store.upload(path, f); return { path: up.path, url: up.url, contentType: f.type || '', size: f.size, ...(hash ? { sha256: hash } : {}) }; };
    try {
      if (step === 'po') {
        const p = blankPO({ number: g.type === 'po' ? g.number : '', vendor: r.vendor || '', needsReview: true, fileName: f.name });
        p.file = await fileObj(`accounting/pos/${p.id}/${safeId(f.name)}`); await persist('pos', p);
        if (r.type === 'quote') await setPOQuote(p, r); else if (r.type === 'invoice') await setInvPO(r, p);
        made.push('PO');
      } else {
        const type = step === 'paid' ? 'receipt' : step;
        const d = { id: 'd_' + uid(), type, number: g.number, vendor: r.vendor || '', date: '', amount: '', status: DOC_STATUS[type][0], tags: [], description: step === 'paid' ? 'Payment confirmation' : '', items: [], linkedTxnIds: [], needsReview: true, createdAt: new Date().toISOString(), fileName: f.name };
        d.file = await fileObj(`accounting/docs/${d.id}/${safeId(f.name)}`); await persist('docs', d);
        if (type === 'invoice') { if (c.pos[0]) await setInvPO(d, c.pos[0]); else if (c.quotes[0]) await setInvQuote(d, c.quotes[0]); }
        if (type === 'quote') { if (ATTACH.has(r.type)) await setAttachQuote(r, d); else if (c.pos[0]) await setPOQuote(c.pos[0], d); else if (r.type === 'invoice') await setInvQuote(r, d); }
        if (ATTACH.has(type)) { const q = r.type === 'quote' ? r : c.quotes[0]; if (q) await setAttachQuote(d, q); }
        if (type === 'receipt') { const pays = chainPayments(kind, r).pays; const tid = payTxnId || (pays.length === 1 ? pays[0].t.id : null); if (tid) { const t = S.txns.find(x => x.id === tid); d.amount = Math.abs(t.amount); d.date = t.date; await persist('docs', d); await setLink(linkItem('doc', d), tid, true); } }
        made.push(DOC_TYPES[type].toLowerCase());
      }
      n++;
    } catch (e) { DBG.err('drop upload failed: ' + f.name, e); toast('Upload failed: ' + (e.code || e.message), 6000); }
  }
  if (n) toast(`Added ${n === 1 ? 'a ' + made[0] : n + ' documents'} from file — linked and marked "needs review" so you can fill in the details`, 5000);
  return n;
}

/* Linkage panel: Quote › PO › Invoice › Payments for the record being edited — open, unlink, or link in place. */
function linkagePanel(host, kind, id, hooks = {}) {
  const draw = () => {
    const r = recOf(kind, id); if (!r) { host.innerHTML = ''; return; }
    const c = chainOf(kind, r); const P = chainPayments(kind, r);
    const myType = kind === 'po' ? 'po' : r.type;
    const isAtt = kind !== 'po' && ATTACH.has(r.type);
    const cols = r.type === 'receipt' ? ['self', 'paid'] : isAtt ? ['quote', 'self'] : ['quote', 'po', 'invoice', 'paid'];
    const label = { quote: 'Quote', po: 'Purchase order', invoice: 'Invoice', paid: 'Payments', self: DOC_TYPES[r.type] };
    const item = (k, x, step) => `<div class="lkItem"><span><b>${k === 'po' ? 'PO' : DOC_TYPES[x.type]}</b> ${esc(x.number || '')} · ${esc(x.vendor || x.fileName || '')}<br><span class="small muted">${fmtDate(x.date)} · ${money(k === 'po' ? poTotals(x).total : x.amount)}${x.status ? ' · ' + esc(x.status) : ''}</span></span>
      <span class="lkBtns"><button type="button" class="b sm" data-open="${k}:${x.id}" title="Open this document">Open</button><button type="button" class="b sm danger" data-unlink="${step}:${x.id}" title="Remove this link">✕</button></span></div>`;
    const opt = o => `<option value="${o.id}">${o.score >= 50 ? '★ ' : ''}${esc(o.text)}${o.taken ? ' — ' + esc(o.taken) : ''}</option>`;
    const sel = (step, opts, extra = '') => { const av = opts.filter(o => !o.taken), tk = opts.filter(o => o.taken);
      return `<select class="lkAdd" data-add="${step}"><option value="">＋ Link ${{ paid: 'a payment', po: 'a PO', invoice: 'an invoice', quote: 'a quote', attach: 'an existing proposal, result or other document' }[step]}…</option>${extra}${av.map(opt).join('')}${tk.length ? `<optgroup label="Linked elsewhere — choosing one moves it here">${tk.map(opt).join('')}</optgroup>` : ''}</select>`; };
    const docOpt = (d, ref) => ({ id: d.id, score: relScore(ref, d), text: `${d.number || '—'} · ${d.vendor || d.fileName || ''} · ${money(d.amount)} · ${fmtDate(d.date)}` });
    const poOpt = (p, ref) => ({ id: p.id, score: relScore(ref, p), text: `${p.number || '—'} · ${p.vendor || ''} · ${money(poTotals(p).total)} · ${fmtDate(p.date)}` });
    const rank = L => L.sort((a, b) => b.score - a.score).slice(0, 60);
    const col = step => {
      if (step === 'self' || step === myType) {
        const sib = myType === 'invoice' ? c.invs.filter(i => i.id !== r.id) : [];
        return `<div class="lkCol self"><div class="lkHead">● ${label[step === 'self' ? 'self' : step]}${sib.length ? ` <span class="muted">(${c.invs.length})</span>` : ''}</div><div class="small muted">this document</div>${sib.map(i => item('doc', i, 'invoice')).join('')}${sib.length ? '' : ''}</div>`;
      }
      let inner = '', ok = false;
      if (step === 'quote' && isAtt) {
        ok = !!c.quotes.length; inner = c.quotes.map(q => item('doc', q, 'quote')).join('');
        if (!ok) inner += sel('quote', rank(S.docs.filter(d => d.type === 'quote').map(d => docOpt(d, r))));
      } else if (step === 'quote') {
        ok = !!c.quotes.length; inner = c.quotes.map(q => item('doc', q, 'quote')).join('');
        if (!ok) inner += c.pos.length ? sel('quote', rank(S.docs.filter(d => d.type === 'quote').map(d => { const u = S.pos.find(p => p.quoteId === d.id && p.id !== c.pos[0].id); return { ...docOpt(d, c.pos[0]), taken: u ? 'on ' + u.number : '' }; })))
          : r.type === 'invoice' ? sel('quote', rank(S.docs.filter(d => d.type === 'quote').map(d => docOpt(d, r)))) : `<div class="small muted">Link a PO first.</div>`;
      }
      if (step === 'po') {
        ok = !!c.pos.length; inner = c.pos.map(p => item('po', p, 'po')).join('');
        if (!ok) inner += r.type === 'quote' ? sel('po', rank(S.pos.filter(p => p.status !== 'cancelled').map(p => ({ ...poOpt(p, r), taken: p.quoteId && p.quoteId !== r.id ? 'for quote ' + (S.docs.find(d => d.id === p.quoteId)?.number || '?') : '' }))), '<option value="__new">＋ Create a PO from this quote</option>') : sel('po', rank(S.pos.filter(p => p.status !== 'cancelled').map(p => poOpt(p, r))));
      }
      if (step === 'invoice') {
        ok = !!c.invs.length; inner = c.invs.map(i => item('doc', i, 'invoice')).join('');
        inner += (c.pos.length || c.quotes.length) ? sel('invoice', rank(S.docs.filter(d => d.type === 'invoice' && !c.invs.includes(d)).map(d => ({ ...docOpt(d, c.pos[0] || c.quotes[0]), taken: invTaken(d, c) })))) : `<div class="small muted">Link a quote or PO first.</div>`;
      }
      if (step === 'paid') {
        ok = P.pays.length > 0;
        const inv1 = c.invs.length === 1 ? c.invs[0] : null;

      if (step === 'quote' && ATTACH.has(r.type)) { await setAttachQuote(r, recOf('doc', v)); return after(); }

      if (step === 'po') {

        return after();

      if (step === 'invoice') { if (c.pos[0]) await setInvPO(recOf('doc', v), c.pos[0]); else await setInvQuote(recOf('doc', v), c.quotes[0]); return after(); }
      if (step === 'paid') { const tgt = c.invs[0] ? linkItem('doc', c.invs[0]) : c.pos[0] ? linkItem('po', c.pos[0]) : linkItem(kind === 'po' ? 'po' : 'doc', r); const note = await setLink(tgt, v, true); return after('Payment linked to ' + tgt.typeLabel.toLowerCase() + ' ' + (tgt.number || '') + (note || '')); }
    } catch (err) { DBG.err('linkage change failed', err); toast('Could not link: ' + (err.code || err.message), 5000); s.disabled = false; }
  });
  draw();
  return draw;
}

function poTotals(p) { if (!(p.items || []).length && +p.totalOverride) return { sub: +p.totalOverride, tax: 0, total: +p.totalOverride }; const sub = (p.items || []).reduce((s, i) => s + i.qty * i.price, 0); const tax = sub * (+p.taxRate || 0) / 100; const total = sub + tax + (+p.shipping || 0); return { sub, tax, total }; }
function nextPONumber() {
  const pre = (S.settings.poPrefix || 'PO') + '-' + today().slice(0, 4) + '-';
  const n = S.pos.map(p => p.number || '').filter(x => x.startsWith(pre)).map(x => parseInt(x.slice(pre.length)) || 0);
  return pre + String((n.length ? Math.max(...n) : 0) + 1).padStart(3, '0');
}

function authHint(e) {
  const c = e?.code || '';
  if (c === 'auth/unauthorized-domain') return `"${location.hostname}" is not an authorized domain. Firebase console → Security → Authentication → Settings → Authorized domains → Add domain → ${location.hostname}`;
  if (c === 'auth/popup-blocked') return 'The browser blocked the popup. Allow popups for this site, or use "Sign in with Google (redirect)".';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return 'The popup was closed before sign-in finished.';
  if (c === 'auth/operation-not-allowed') return 'Google (or Email/Password) sign-in is not enabled in Firebase → Authentication → Sign-in method.';
  if (c === 'auth/operation-not-supported-in-this-environment') return 'Sign-in needs http(s) — this page was opened as a local file.';
  if (c === 'auth/network-request-failed') return 'Network request failed — ad-blocker, VPN, or firewall blocking googleapis.com?';
  if (c === 'auth/internal-error') return 'Internal error — often third-party cookies/storage blocked, or a misconfigured authDomain.';
  if (c === 'auth/invalid-api-key' || c.startsWith('auth/api-key')) return 'API key rejected — check apiKey and any key restrictions (HTTP referrers) in Google Cloud console → Credentials.';
  return '';
}

    $('#modal').addEventListener('click', function onX(e) { if (e.target.id === 'modal' || e.target.closest('[data-close]')) { $('#modal').removeEventListener('click', onX); if ($('#siGoogle')) return; DBG.info('sign-in dialog closed'); res(false); } });

}
let bootSeq = 0;
async function boot() {
  const seq = ++bootSeq;
  DBG.mark('boot');
  setConn('', 'Connecting…');
  $('#main').innerHTML = `<div class="card"><b>Connecting to Firebase…</b><div class="small muted" style="margin-top:6px">If this takes more than a few seconds, click <a href="#" id="bootDbg">🐞 Debug</a> → Run diagnostics → Copy debug report.</div></div>`;
  $('#bootDbg').onclick = e => { e.preventDefault(); toggleDebug(true); };
  setTimeout(() => { if (seq === bootSeq && /Connecting/.test($('#conn').textContent)) { DBG.warn('boot: still connecting after 15s'); setConn('warn', 'Still connecting… see Debug'); toggleDebug(true); } }, 15000);
  const cfg = LS.get('ledger.fbConfig', FIREBASE_CONFIG); const prefix = LS.get('ledger.prefix', defaultPrefix(cfg));
  DBG.info('boot config', { source: localStorage.getItem('ledger.fbConfig') ? 'localStorage (Settings)' : 'hard-coded FIREBASE_CONFIG', projectId: cfg?.projectId, authDomain: cfg?.authDomain, storageBucket: cfg?.storageBucket, prefix, requireAuth: LS.get('ledger.auth', false), forceLocal: LS.get('ledger.forceLocal', false) });
  store = null;
  if (cfg && !LS.get('ledger.forceLocal', false)) {
    try {
      store = await makeFirebase(cfg, prefix);
      if (LS.get('ledger.auth', false) && !store.auth.currentUser) { setConn('warn', 'Waiting for sign-in'); DBG.info('boot: sign-in required, showing dialog'); const ok = await signIn(); if (!ok) { LS.set('ledger.forceLocal', true); store = null; } }
    } catch (e) { DBG.err('boot: Firebase setup failed → local mode', e); toast('Firebase failed: ' + (e.code || e.message) + ' — using local mode. Open Debug for details.', 7000); store = null; }
  }
  if (!store) store = await makeLocal();
  DBG.info('boot: storage backend = ' + store.kind);
  try {
    const d = await store.loadAll();
    S.accounts = d.accounts || []; S.txns = d.txns || []; S.docs = d.docs || []; S.pos = d.pos || [];
    S.settings = { ...DEFAULT_SETTINGS, ...((d.settings || []).find(x => x.id === 'main') || {}) };
    const ph = S.txns.filter(t => t.autoTransfer);
    if (ph.length) {
      const origins = ph.map(x => S.txns.find(o => o.id === x.transferPairId)).filter(Boolean); origins.forEach(o => o.transferPairId = '');
      S.txns = S.txns.filter(t => !t.autoTransfer);
      try { await store.delMany('txns', ph.map(x => x.id)); if (origins.length) await persistMany('txns', origins); await autoPairTransfers(); DBG.info(`removed ${ph.length} auto-created transfer entries`); toast(`Removed ${ph.length} auto-created transfer entr${ph.length > 1 ? 'ies' : 'y'} — transfers now pair only with real transactions`, 6000); }
      catch (e) { DBG.err('transfer placeholder cleanup failed', e); }
    }
    { const ids = new Set(S.txns.map(t => t.id)); const fixD = [], fixP = [];
      if (S.txns.length) for (const [arr, out] of [[S.docs, fixD], [S.pos, fixP]]) arr.forEach(x => { const L = x.linkedTxnIds || []; const keep = [...new Set(L.filter(id => ids.has(id)))]; if (keep.length !== L.length) { x.linkedTxnIds = keep; out.push(x); } });
      if (fixD.length || fixP.length) { try { if (fixD.length) await persistMany('docs', fixD); if (fixP.length) await persistMany('pos', fixP); DBG.info(`removed links to deleted transactions from ${fixD.length + fixP.length} document(s)`); } catch (e) { DBG.err('link cleanup failed', e); } } }
    if (!S.settings.bankClassified) {
      const bk = S.txns.filter(t => !t.cls && BANK_RE.test(t.description)); bk.forEach(t => t.cls = 'bank');
      try { if (bk.length) await persistMany('txns', bk); S.settings.bankClassified = true; await persist('settings', S.settings); if (bk.length) { DBG.info(`classified ${bk.length} existing entries as bank activity`); toast(`Marked ${bk.length} interest/fee entr${bk.length > 1 ? 'ies' : 'y'} as 🏦 Bank activity`, 5000); } } catch (e) { DBG.err('bank classification failed', e); }
    }
    const legacy = S.txns.filter(t => LEGACY_CAPITAL.has(t.cls));
    if (legacy.length) { legacy.forEach(t => t.cls = 'capital'); DBG.info(`migrating ${legacy.length} capital infusion/withdrawal → capital`); persistMany('txns', legacy).catch(e => DBG.err('capital migration failed', e)); }
    setConn(store.kind === 'firebase' ? 'ok' : 'warn', store.kind === 'firebase' ? `Firebase · ${store.projectId}${store.auth.currentUser ? ' · ' + (store.auth.currentUser.email || 'anon') : ''}` : 'Local mode');
    DBG.info('boot: data loaded', { accounts: S.accounts.length, txns: S.txns.length, docs: S.docs.length, pos: S.pos.length });
  } catch (e) {
    DBG.err('boot: data load failed', e);
    setConn('bad', 'Load failed'); toast('Could not load data: ' + (e.code || e.message) + (e.code === 'permission-denied' ? ' — Firestore rules rejected this user.' : '') + ' Open Debug for details.', 9000);
    if (store.kind === 'firebase') { const fb = store; store = await makeLocal(); store._failedFirebase = fb; const d = await store.loadAll(); Object.assign(S, { accounts: d.accounts, txns: d.txns, docs: d.docs, pos: d.pos }); setConn('bad', 'Firebase error — local mode'); }
  }
  go(UI.tab);
}

/* ---------------- debug panel & diagnostics ---------------- */
function envInfo() {
  const cfg = LS.get('ledger.fbConfig', FIREBASE_CONFIG) || {};
  const fb = store?.kind === 'firebase' ? store : store?._failedFirebase;
  const u = fb?.auth?.currentUser;
  let ls = false, ss = false; try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); ls = true; } catch {} try { sessionStorage.setItem('_t', '1'); sessionStorage.removeItem('_t'); ss = true; } catch {}
  return {
    when: new Date().toString(), href: location.href, origin: location.origin, protocol: location.protocol, hostname: location.hostname,
    userAgent: navigator.userAgent, cookiesEnabled: navigator.cookieEnabled, localStorage: ls, sessionStorage: ss, indexedDB: !!window.indexedDB,
    inIframe: window.top !== window.self, online: navigator.onLine,
    config: { apiKey: cfg.apiKey ? cfg.apiKey.slice(0, 8) + '…' + cfg.apiKey.slice(-4) : null, authDomain: cfg.authDomain, projectId: cfg.projectId, storageBucket: cfg.storageBucket, appId: cfg.appId, source: localStorage.getItem('ledger.fbConfig') ? 'Settings/localStorage' : 'hard-coded' },
    prefix: LS.get('ledger.prefix', defaultPrefix(cfg)), requireAuth: LS.get('ledger.auth', false), forceLocal: LS.get('ledger.forceLocal', false),
    backend: store?.kind, firebaseSdk: FB_VER,
    user: u ? { uid: u.uid, email: u.email, emailVerified: u.emailVerified, anonymous: u.isAnonymous, providers: u.providerData.map(p => p.providerId) } : null,
    libs: { Chart: !!window.Chart, jsPDF: !!window.jspdf }
  };
}
function report() { return ['=== LEDGER DEBUG REPORT ===', JSON.stringify(envInfo(), null, 2), '', '=== LOG ===', ...DBG.lines()].join('\n'); }
async function runDiagnostics() {
  DBG.mark('diagnostics start');
  const env = envInfo(); DBG.info('env', env);
  if (location.protocol === 'file:') DBG.warn('Opened as file:// — Google sign-in cannot work here.');
  if (env.inIframe) DBG.warn('Page is inside an iframe — popups/storage may be restricted.');
  if (/github\.io$/.test(location.hostname)) DBG.info(`GitHub Pages host — make sure "${location.hostname}" is in Firebase Authorized domains (no https://, no path).`);
  const fb = store?.kind === 'firebase' ? store : store?._failedFirebase;
  if (!fb) { DBG.warn('Firebase not active (local mode). Try Settings → Save & reconnect, then rerun.'); return; }
  try { const r = await fetch(`https://${env.config.authDomain}/__/auth/handler`, { method: 'HEAD', mode: 'no-cors' }); DBG.info('authDomain handler reachable (opaque response)', { type: r.type }); } catch (e) { DBG.err('authDomain handler NOT reachable', e); }
  const u = fb.auth.currentUser;
  if (!u) { DBG.warn('Not signed in — Firestore/Storage tests will use no auth.'); }
  else {
    try { const t = await u.getIdTokenResult(true); DBG.info('ID token claims', { email: t.claims.email, email_verified: t.claims.email_verified, sign_in_provider: t.signInProvider, aud: t.claims.aud, expires: t.expirationTime }); if (t.claims.aud !== env.config.projectId) DBG.err('token audience ≠ projectId'); }
    catch (e) { DBG.err('getIdTokenResult failed', e); }
  }
  const { F, S, db, st, prefix } = fb;
  try { const s = await F.getDocs(F.query(F.collection(db, prefix + 'settings'), F.limit(1))); DBG.info(`TEST firestore read ${prefix}settings: OK (${s.size} doc)`); } catch (e) { DBG.err(`TEST firestore read ${prefix}settings: FAILED`, e); }
  const probe = F.doc(db, prefix + 'settings', '_debug_probe');
  try { await F.setDoc(probe, { at: new Date().toISOString(), uid: u?.uid || null }); DBG.info('TEST firestore write: OK'); await F.deleteDoc(probe); DBG.info('TEST firestore delete: OK'); } catch (e) { DBG.err('TEST firestore write/delete: FAILED', e); }
  try { const l = await S.list(S.ref(st, 'accounting/docs'), { maxResults: 1 }); DBG.info(`TEST storage list accounting/docs: OK (${l.prefixes.length + l.items.length} entries)`); } catch (e) { DBG.err('TEST storage list: FAILED', e); }
  const pr = S.ref(st, 'accounting/_debug_probe.txt');
  try { await S.uploadString(pr, 'probe ' + new Date().toISOString()); DBG.info('TEST storage upload: OK'); await S.getDownloadURL(pr); DBG.info('TEST storage getDownloadURL: OK'); await S.deleteObject(pr); DBG.info('TEST storage delete: OK'); } catch (e) { DBG.err('TEST storage upload/url/delete: FAILED', e); }
  DBG.mark('diagnostics done');
}
